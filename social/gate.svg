<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Four invoices pass one settlement gate: blocked, held, escalated, released on Solana devnet.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101D"/><stop offset="1" stop-color="#0D2240"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <radialGradient id="glow" cx=".1" cy=".95" r=".7"><stop offset="0" stop-color="#19D3FF" stop-opacity=".16"/><stop offset="1" stop-color="#19D3FF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(80 70)"><rect width="52" height="52" rx="13" fill="#0B1B33" stroke="#19D3FF" stroke-opacity=".5"/><path d="M12 16l7 21 7-15 7 15 7-21" fill="none" stroke="#19D3FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="14" r="3" fill="#C29A45"/></g>
  <text x="148" y="106" font-family="Fraunces, serif" font-size="40" fill="#fff" font-weight="600">Wharfinger</text>
  <g transform="translate(1100 72)"><rect width="420" height="46" rx="23" fill="none" stroke="#C29A45" stroke-opacity=".7"/><text x="210" y="30" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="3" fill="#C29A45">SETTLEMENT GATE · SOLANA DEVNET</text></g>

  <text x="80" y="250" font-family="Fraunces, serif" font-size="92" font-weight="600" fill="#fff" letter-spacing="-2">A payment waits</text>
  <text x="80" y="346" font-family="Fraunces, serif" font-size="92" font-weight="600" fill="#C29A45" letter-spacing="-2">for the evidence.</text>
  <text x="80" y="402" font-family="Instrument Sans, sans-serif" font-size="28" fill="#9FB0C7">Four demurrage invoices, one gate, paid Telegraph receipts deciding.</text>

  <g font-family="Instrument Sans, sans-serif">
    <g transform="translate(80 430)">
      <rect width="1440" height="90" rx="20" fill="#0A1A2E" stroke="#FFFFFF" stroke-opacity=".08"/>
      <text x="36" y="40" font-size="27" font-weight="600" fill="#fff">Tampered statement</text><text x="36" y="69" font-size="21" fill="#8FA3BD">one minute added, so it does not recompute</text>
      <rect x="1126" y="21" width="278" height="48" rx="24" fill="#E5484D" fill-opacity=".16" stroke="#E5484D"/><text x="1265" y="53" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3" fill="#FF6B70">BLOCK</text>
    </g>
    <g transform="translate(80 532)">
      <rect width="1440" height="90" rx="20" fill="#0A1A2E" stroke="#FFFFFF" stroke-opacity=".08"/>
      <text x="36" y="40" font-size="27" font-weight="600" fill="#fff">Owner has not countersigned</text><text x="36" y="69" font-size="21" fill="#8FA3BD">nobody has agreed or disputed the hours</text>
      <rect x="1126" y="21" width="278" height="48" rx="24" fill="#C29A45" fill-opacity=".16" stroke="#C29A45"/><text x="1265" y="53" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3" fill="#E3BB68">HOLD</text>
    </g>
    <g transform="translate(80 634)">
      <rect width="1440" height="90" rx="20" fill="#0A1A2E" stroke="#FFFFFF" stroke-opacity=".08"/>
      <text x="36" y="40" font-size="27" font-weight="600" fill="#fff">Payee matches a sanctions list</text><text x="36" y="69" font-size="21" fill="#8FA3BD">paid screening receipt 0x997ede...8171, a person decides</text>
      <rect x="1126" y="21" width="278" height="48" rx="24" fill="#E58A45" fill-opacity=".16" stroke="#E58A45"/><text x="1265" y="53" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3" fill="#FFA566">ESCALATE</text>
    </g>
    <g transform="translate(80 736)">
      <rect width="1440" height="90" rx="20" fill="#0A1E1D" stroke="#2BB88A" stroke-opacity=".55"/>
      <text x="36" y="40" font-size="27" font-weight="600" fill="#fff">Everything checks</text><text x="36" y="69" font-size="21" fill="#8FC9B5">$4,500.00 sent on Solana devnet, read back from the chain · tx 3uAkgU...15M5</text>
      <rect x="1126" y="21" width="278" height="48" rx="24" fill="#2BB88A" fill-opacity=".18" stroke="#2BB88A"/><text x="1265" y="53" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3" fill="#47D6A5">RELEASE</text>
    </g>
  </g>
  <text x="80" y="880" font-family="IBM Plex Mono, monospace" font-size="18" fill="#19D3FF">wharfinger-kinnoskis-projects.vercel.app/settle</text>
  <text x="1520" y="880" text-anchor="end" font-family="Instrument Sans, sans-serif" font-size="19" fill="#7E91AC">Devnet test token, not USDC. Hackathon entry. AI assisted.</text>
</svg>
