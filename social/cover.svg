  <g transform="translate(80 700)">
    <rect width="780" height="86" rx="43" fill="#0A1A2E" stroke="#19D3FF" stroke-opacity=".5"/>
    <circle cx="43" cy="43" r="14" fill="#19D3FF"/><path d="M36 43l5 5 9-10" fill="none" stroke="#06101D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="55" font-family="Instrument Sans, sans-serif" font-size="30" font-weight="600" fill="#fff">Wharfinger buys the proof while it is true.</text>
  </g>
  <text x="80" y="860" font-family="Instrument Sans, sans-serif" font-size="20" fill="#7E91AC">Rate and hours are an invented example. Telegraph testnet. Hackathon entry. Built with AI assistance.</text>
