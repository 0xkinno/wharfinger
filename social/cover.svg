    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <radialGradient id="glow" cx=".8" cy=".45" r=".55"><stop offset="0" stop-color="#C29A45" stop-opacity=".22"/><stop offset="1" stop-color="#C29A45" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(80 70)"><rect width="52" height="52" rx="13" fill="#0B1B33" stroke="#19D3FF" stroke-opacity=".5"/><path d="M12 16l7 21 7-15 7 15 7-21" fill="none" stroke="#19D3FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="14" r="3" fill="#C29A45"/></g>
  <text x="148" y="106" font-family="Fraunces, serif" font-size="40" fill="#fff" font-weight="600">Wharfinger</text>
  <g transform="translate(1100 72)"><rect width="420" height="46" rx="23" fill="none" stroke="#C29A45" stroke-opacity=".7"/><text x="210" y="30" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="3" fill="#C29A45">DEMURRAGE · TELEGRAPH TESTNET</text></g>

  <text x="80" y="255" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="5" fill="#9FB0C7">THE $750 HOUR</text>
  <text x="80" y="380" font-family="Fraunces, serif" font-size="130" font-weight="600" fill="#fff" letter-spacing="-3">41 hours.</text>
  <text x="80" y="505" font-family="Fraunces, serif" font-size="130" font-weight="600" fill="#C29A45" letter-spacing="-3">$750 an hour.</text>
  <text x="80" y="580" font-family="Instrument Sans, sans-serif" font-size="40" fill="#C9D5E6">And one handwritten page to argue with.</text>

  <!-- the handwritten page -->
  <g transform="translate(1060 280) rotate(5)" filter="url(#sh)">
