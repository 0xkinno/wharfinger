    <rect x="0" y="0" width="470" height="56" rx="10" fill="#E6DFCD"/>
    <text x="28" y="36" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="3" fill="#5C5240">STATEMENT OF FACTS</text>
    <g fill="none" stroke="#6F6450" stroke-width="3" stroke-linecap="round">
      <path d="M30 100c18-10 28 8 46-2s30 6 50-3 34 8 60-2 40 6 70 0"/>
      <path d="M30 148c24-8 34 6 56-2s26 8 52-1 44 7 76-2"/>
      <path d="M30 196c14-9 30 7 52-1s34 5 58-2 36 7 66-1 46 4 78-2 40 5 60 0"/>
      <path d="M30 244c22-7 28 8 54-1s38 6 62-2 30 7 58-1"/>
      <path d="M30 292c16-9 32 6 50-2s34 7 60-1 40 5 70-1 40 6 62 0"/>
      <path d="M30 340c20-8 26 7 50-1s32 6 56-2"/>
    </g>
    <path d="M26 197H410" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="396" font-family="IBM Plex Mono, monospace" font-size="19" fill="#8A7D63">NOR 02:40 ???   snow, twice?</text>
