name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Banned third-party names
        run: pnpm check:clean
      - name: House style
        run: pnpm check:copy
      - name: Typecheck
        run: pnpm typecheck
      # Added as each phase lands: unit and property tests (Phase 3), Playwright (Phase 7),
      # FACTS consistency (Phase 8), clean-clone offline verify (Phase 6).
